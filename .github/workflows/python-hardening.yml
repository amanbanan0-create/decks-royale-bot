name: Python bot hardening checks

on:
  push:
    branches: [v2.1-hardening, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: python-hardening-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: "."
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      ADMIN_IDS: "123456"
      WEBHOOK_SECRET: "ci-webhook-secret-1234567890123456"
      CLASH_ROYALE_API_KEY: "ci-clash-api-key"
      RENDER_EXTERNAL_URL: "https://bot.example.com"
      MINI_APP_URL: "https://mini.example.com"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12.14"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install --upgrade pip==26.2.1 && python -m pip install -r requirements.txt
      - name: Install audit/test tooling
        run: python -m pip install pytest==9.1.1 pip-audit==2.10.1
      - name: Compile all entrypoints
        run: python -m compileall -q main.py main_miniapp.py extra_features.py bot_hardening.py bot_hardening_runtime.py
      - name: Unit tests
        run: python -m pytest -q
      - name: Import hardened Render entrypoint
        run: python -c "import main_miniapp; assert main_miniapp.app is main_miniapp.original.app"
      - name: Dependency consistency
        run: python -m pip check
      - name: Dependency security audit
        run: python -m pip_audit -r requirements.txt
