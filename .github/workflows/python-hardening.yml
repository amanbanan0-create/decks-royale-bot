name: Python bot hardening checks

on:
  push:
    branches: [v2.1-hardening, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      BOT_TOKEN: "123456:ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghi"
      ADMIN_IDS: "123456"
      WEBHOOK_SECRET: "ci-webhook-secret-1234567890123456"
      CLASH_ROYALE_API_KEY: "ci-clash-api-key"
      RENDER_EXTERNAL_URL: "https://bot.example.com"
      MINI_APP_URL: "https://mini.example.com"
      DATABASE_URL: "postgresql://postgres:postgres@127.0.0.1:5432/postgres"
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install production dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Install audit/test tooling
        run: pip install pytest pip-audit
      - name: Compile all entrypoints
        run: python -m compileall -q main.py main_miniapp.py extra_features.py bot_hardening.py bot_hardening_runtime.py
      - name: Unit tests
        id: unit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pytest -q 2>&1 | tee pytest-output.txt
      - name: Import hardened Render entrypoint
        id: import_smoke
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python -c "import main_miniapp; assert main_miniapp.app is main_miniapp.original.app" 2>&1 | tee import-output.txt
      - name: Dependency consistency
        id: pip_check
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip check 2>&1 | tee pip-check-output.txt
      - name: Dependency security audit
        id: pip_audit
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pip-audit -r requirements.txt 2>&1 | tee pip-audit-output.txt
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-hardening-diagnostics
          path: |
            pytest-output.txt
            import-output.txt
            pip-check-output.txt
            pip-audit-output.txt
          retention-days: 3
      - name: Enforce all checks
        if: always()
        shell: bash
        run: |
          test "${{ steps.unit.outcome }}" = "success"
          test "${{ steps.import_smoke.outcome }}" = "success"
          test "${{ steps.pip_check.outcome }}" = "success"
          test "${{ steps.pip_audit.outcome }}" = "success"
